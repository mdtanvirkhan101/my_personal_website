<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" fill="none">
  <rect width="1200" height="630" fill="#0B0B26" />
  <defs>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#789BE0" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141444" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1F2066" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <g stroke="#5A7FC8" stroke-width="0.5" stroke-opacity="0.2">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200 M0 420 H1200 M0 490 H1200 M0 560 H1200" />
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" />
  </g>

  <!-- Header Section -->
  <rect x="80" y="40" width="1040" height="60" rx="12" fill="url(#box-grad)" stroke="#5A7FC8" stroke-opacity="0.4" />
  <circle cx="115" cy="70" r="12" fill="#2DD4BF" fill-opacity="0.2" stroke="#2DD4BF" stroke-width="2" />
  <text x="140" y="76" fill="#F7F6F7" font-family="system-ui, sans-serif" font-weight="700" font-size="18">ENGINEERING TOPOLOGY &amp; ARCHITECTURE DIAGRAM</text>
  <text x="960" y="75" fill="#2DD4BF" font-family="monospace" font-size="13">SYSTEM STATUS: OPTIMAL</text>

  <!-- Client Edge Node -->
  <g transform="translate(100, 180)">
    <rect width="240" height="340" rx="16" fill="url(#box-grad)" stroke="#2DD4BF" stroke-width="1.5" filter="url(#glow)" />
    <rect width="240" height="40" rx="16" fill="#1A1B4B" />
    <text x="25" y="26" fill="#2DD4BF" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Edge Clients &amp; CDN</text>
    <rect x="20" y="60" width="200" height="65" rx="8" fill="#0B0B26" stroke="#5A7FC8" stroke-opacity="0.4" />
    <text x="35" y="90" fill="#F7F6F7" font-family="sans-serif" font-size="13" font-weight="600">Global DNS &amp; WAF</text>
    <text x="35" y="110" fill="#789BE0" font-family="monospace" font-size="11">Cloudflare Anycast IP</text>

    <rect x="20" y="145" width="200" height="65" rx="8" fill="#0B0B26" stroke="#5A7FC8" stroke-opacity="0.4" />
    <text x="35" y="175" fill="#F7F6F7" font-family="sans-serif" font-size="13" font-weight="600">SSL Termination</text>
    <text x="35" y="195" fill="#789BE0" font-family="monospace" font-size="11">TLS 1.3 / HTTP/3 Quic</text>

    <rect x="20" y="230" width="200" height="75" rx="8" fill="#0B0B26" stroke="#5A7FC8" stroke-opacity="0.4" />
    <text x="35" y="260" fill="#F7F6F7" font-family="sans-serif" font-size="13" font-weight="600">Rate Limiter</text>
    <text x="35" y="280" fill="#2DD4BF" font-family="monospace" font-size="11">Sliding-window In-Memory</text>
  </g>

  <!-- Connectors -->
  <path d="M340 350 H480" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="6,6" />
  <circle cx="410" cy="350" r="5" fill="#2DD4BF" />

  <!-- Core App Layer -->
  <g transform="translate(480, 150)">

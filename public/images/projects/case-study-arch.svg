    <rect width="280" height="40" rx="16" fill="#1A1B4B" />
    <text x="25" y="26" fill="#789BE0" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Application Monolith</text>
    
    <rect x="20" y="60" width="240" height="65" rx="8" fill="#0B0B26" stroke="#5A7FC8" stroke-opacity="0.4" />
    <text x="35" y="90" fill="#F7F6F7" font-family="sans-serif" font-size="13" font-weight="600">Next.js 14 App Router</text>
    <text x="35" y="110" fill="#2DD4BF" font-family="monospace" font-size="11">Server Actions + Dynamic Routes</text>

    <rect x="20" y="140" width="240" height="65" rx="8" fill="#0B0B26" stroke="#5A7FC8" stroke-opacity="0.4" />
    <text x="35" y="170" fill="#F7F6F7" font-family="sans-serif" font-size="13" font-weight="600">Centralized AI Hub</text>
    <text x="35" y="190" fill="#789BE0" font-family="monospace" font-size="11">Multi-provider Orchestrator</text>

    <rect x="20" y="220" width="240" height="65" rx="8" fill="#0B0B26" stroke="#5A7FC8" stroke-opacity="0.4" />
    <text x="35" y="250" fill="#F7F6F7" font-family="sans-serif" font-size="13" font-weight="600">Workflow Automation</text>
    <text x="35" y="270" fill="#789BE0" font-family="monospace" font-size="11">Cron Engine + Webhooks</text>

    <rect x="20" y="300" width="240" height="75" rx="8" fill="#0B0B26" stroke="#5A7FC8" stroke-opacity="0.4" />
    <text x="35" y="330" fill="#F7F6F7" font-family="sans-serif" font-size="13" font-weight="600">Auth &amp; Session Guard</text>
    <text x="35" y="350" fill="#2DD4BF" font-family="monospace" font-size="11">SubtleCrypto HMAC Tokens</text>
  </g>

  <!-- Connectors -->
  <path d="M760 350 H880" stroke="#789BE0" stroke-width="3" stroke-dasharray="6,6" />
  <circle cx="820" cy="350" r="5" fill="#789BE0" />

  <!-- Data & Persistence Layer -->
  <g transform="translate(880, 180)">
    <rect width="240" height="340" rx="16" fill="url(#box-grad)" stroke="#2DD4BF" stroke-width="1.5" filter="url(#glow)" />
    <rect width="240" height="40" rx="16" fill="#1A1B4B" />
    <text x="25" y="26" fill="#2DD4BF" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Persistence &amp; Storage</text>

    <rect x="20" y="60" width="200" height="75" rx="8" fill="#0B0B26" stroke="#5A7FC8" stroke-opacity="0.4" />
    <text x="35" y="90" fill="#F7F6F7" font-family="sans-serif" font-size="13" font-weight="600">PostgreSQL (Primary)</text>
    <text x="35" y="110" fill="#2DD4BF" font-family="monospace" font-size="11">Prisma ORM Connection Pool</text>

    <rect x="20" y="150" width="200" height="75" rx="8" fill="#0B0B26" stroke="#5A7FC8" stroke-opacity="0.4" />
    <text x="35" y="180" fill="#F7F6F7" font-family="sans-serif" font-size="13" font-weight="600">Automated Snapshots</text>
    <text x="35" y="200" fill="#789BE0" font-family="monospace" font-size="11">Schema-verified JSON dump</text>

    <rect x="20" y="240" width="200" height="65" rx="8" fill="#0B0B26" stroke="#5A7FC8" stroke-opacity="0.4" />
    <text x="35" y="270" fill="#F7F6F7" font-family="sans-serif" font-size="13" font-weight="600">Telegram Dispatch</text>
    <text x="35" y="290" fill="#2DD4BF" font-family="monospace" font-size="11">Bot Alerting &amp; Archival</text>
  </g>

  <!-- Footer details -->
  <text x="100" y="595" fill="#789BE0" font-family="monospace" font-size="12">LATENCY &lt; 45ms • 100/100 LIGHTHOUSE SCORE • ZERO EXTERNAL DEPENDENCY MONOLITH</text>
</svg>

